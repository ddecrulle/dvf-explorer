[project]
name = "dvf-explorer"
version = "0.0.0"
description = "Explore French property sales and cadastral evidence"
requires-python = ">=3.14,<3.16"
dependencies = [
    "boto3>=1.43.115,<2",
    "duckdb>=1.5.6,<2",
    "fastapi>=0.151,<1",
    "httpx>=0.28.1,<1",
    "ijson>=3.6,<4",
    "pyproj>=3.8,<4",
    "python-dotenv>=1.2.4,<2",
    "shapely>=2.2,<3",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
test = ["pytest>=9.2,<10"]
tools = ["ruff>=0.17.3,<0.18", "PyYAML>=6.0.3,<7"]
dev = [{include-group = "test"}, {include-group = "tools"}]

[tool.uv]
package = false
