name: CI and Docker publication

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      image_tags: ${{ steps.plan.outputs.image_tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'
      - name: Validate version and plan release
        id: plan
        run: python scripts/release_plan.py

  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-tools.txt
      - run: ruff format --check backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm test && npm run build
        working-directory: frontend
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Validate Helm defaults and deployment variants
        run: |
          helm lint charts --strict
          helm lint charts -f charts/values-sspcloud.yaml --strict
          python scripts/check_chart.py
      - name: Package chart with this commit's immutable image tag
        run: helm package charts --app-version "sha-${GITHUB_SHA}" --destination dist/charts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'amd64'
        with:
          name: helm-chart-${{ github.sha }}
          path: dist/charts/*.tgz
          if-no-files-found: error
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: dvf-explorer:ci
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
      - name: Smoke-test non-root Docker runtime
        run: |
          docker run --rm --env DVF_DATASET_URL=local --user 10001:10001 --tmpfs /app/data:uid=10001,gid=10001 dvf-explorer:ci python -c "import sys, os, shutil, importlib.util; assert sys.version_info[:2] == (3, 15); assert os.getuid() == 10001; assert shutil.which('sh') is None; assert importlib.util.find_spec('pip') is None; from zoneinfo import ZoneInfo; assert str(ZoneInfo('Europe/Paris')) == 'Europe/Paris'; sys.path.insert(0, 'backend'); from fastapi.testclient import TestClient; from main import app; import duckdb; from object_store import load_httpfs; load_httpfs(duckdb.connect()); c = TestClient(app); assert c.get('/api/health').status_code == 200; assert c.get('/').status_code == 200; assert c.get('/api/status').status_code == 200"
      - name: Test backend in the minimal runtime
        run: |
          docker run --rm --env DVF_DATASET_URL=local \
            --tmpfs /app/data:uid=10001,gid=10001 \
            --mount type=bind,source="$PWD/scripts",target=/app/scripts,readonly \
            dvf-explorer:ci python -m pytest backend/tests -q
      - name: Scan runtime image for all known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: dvf-explorer:ci
          scanners: vuln
          format: json
          output: trivy-image.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Upload runtime vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-vulnerabilities-${{ matrix.arch }}-${{ github.sha }}
          path: trivy-image.json
          if-no-files-found: ignore

  publish:
    needs: [checks, version]
    if: github.repository == 'ddecrulle/dvf-explorer' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ddecrulle
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish Linux amd64 and arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.version.outputs.image_tags }}
          cache-from: |
            type=gha,scope=runtime-amd64
            type=gha,scope=runtime-arm64
          cache-to: type=gha,mode=max,scope=publication
          provenance: true
          sbom: true

  release:
    needs: [checks, version, publish]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Package chart for the released Docker image
        run: helm package charts --app-version "$RELEASE_TAG" --destination dist/release
      - name: Create tag and GitHub release after Docker publication
        run: |
          # gh creates the missing tag at the validated commit. A retry reuses it.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/*.tgz \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
