name: CI and Docker publication

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      image_tags: ${{ steps.plan.outputs.image_tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate version and plan release
        id: plan
        run: python scripts/release_plan.py

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - run: ruff format --check backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm test && npm run build
        working-directory: frontend
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Validate Helm defaults and deployment variants
        run: |
          helm lint charts --strict
          helm lint charts -f charts/values-sspcloud.yaml --strict
          python scripts/check_chart.py
      - name: Package chart with this commit's immutable image tag
        run: helm package charts --app-version "sha-${GITHUB_SHA}" --destination dist/charts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helm-chart-${{ github.sha }}
          path: dist/charts/*.tgz
          if-no-files-found: error
      - name: Build and smoke-test non-root Docker runtime
        run: |
          docker build -t dvf-explorer:ci .
          docker run --rm --env DVF_DATASET_URL=local --user 10001:10001 --tmpfs /app/data:uid=10001,gid=10001 dvf-explorer:ci python -c "import sys; sys.path.insert(0, 'backend'); from fastapi.testclient import TestClient; from main import app; import duckdb; from object_store import load_httpfs; load_httpfs(duckdb.connect()); c = TestClient(app); assert c.get('/api/health').status_code == 200; assert c.get('/').status_code == 200; assert c.get('/api/status').status_code == 200"

  publish:
    needs: [checks, version]
    if: github.repository == 'ddecrulle/dvf-explorer' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ddecrulle
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish Linux amd64 and arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.version.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    needs: [checks, version, publish]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Package chart for the released Docker image
        run: helm package charts --app-version "$RELEASE_TAG" --destination dist/release
      - name: Create tag and GitHub release after Docker publication
        run: |
          # gh creates the missing tag at the validated commit. A retry reuses it.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/*.tgz \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
