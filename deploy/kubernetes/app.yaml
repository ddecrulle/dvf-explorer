# Remplacer DOCKERHUB_NAMESPACE et VERSION avant application.
# Secret requis : dvf-admin, clé token. Voir README.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dvf-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvf-explorer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dvf-explorer
  template:
    metadata:
      labels:
        app: dvf-explorer
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: app
          image: DOCKERHUB_NAMESPACE/dvf-explorer:VERSION
          ports:
            - containerPort: 8000
          env:
            - name: DVF_DATA_DIR
              value: /app/data
            - name: DVF_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dvf-admin
                  key: token
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dvf-data
---
apiVersion: v1
kind: Service
metadata:
  name: dvf-explorer
spec:
  selector:
    app: dvf-explorer
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
