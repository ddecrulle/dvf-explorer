# The CronJob calls the single API writer; it does not open DuckDB.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dvf-national-sync
spec:
  # Do not restrict both day fields: cron would combine them with OR.
  # The client skips weekends before contacting the API.
  schedule: "0 9,16 1-14 4,10 *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 176400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: DOCKERHUB_NAMESPACE/dvf-explorer:VERSION
              command: [python, backend/sync_remote.py, --scheduled]
              env:
                - name: DVF_API_URL
                  value: http://dvf-explorer:8000
                - name: DVF_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dvf-admin
                      key: token
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
