apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dvf-explorer.fullname" . }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: health
      image: {{ include "dvf-explorer.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: [python, -c]
      args:
        - {{ printf "import urllib.request; urllib.request.urlopen('http://%s:%v/api/health', timeout=15)" (include "dvf-explorer.fullname" .) .Values.service.port | quote }}
