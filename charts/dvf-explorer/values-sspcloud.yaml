# Example only: replace the domain, image version and storage class as needed.
image:
  repository: ddecrulle/dvf-explorer
  tag: main # Prefer sha-<full commit SHA> or image.digest for repeatable rollouts.
dataset:
  url: s3://ddecrulle/DVF_Explorer/curated/current.json
  endpoint: https://minio.lab.sspcloud.fr
  anonymous: true
replicaCount: 2
admin:
  existingSecret: dvf-admin
persistence:
  enabled: false
  size: 100Gi
  storageClass: null
  # To reuse the PVC from the earlier raw manifests:
  # existingClaim: dvf-data
ingress:
  enabled: true
  className: "" # Set to your cluster's IngressClass if required.
  hosts:
    - host: dvf.example.com # Replace with the domain assigned by your platform.
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dvf-tls
      hosts: [dvf.example.com]
# If objects become private, set dataset.anonymous=false and inject renewable
# AWS credentials from a Kubernetes Secret through extraEnvFrom.
sync:
  enabled: false
