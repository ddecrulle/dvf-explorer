# Installation : namespace user-ddecrulle, contexte apiserver.kub.sspcloud.fr.
# Attendre la publication de cette version sur Docker Hub avant installation.
image:
  repository: ddecrulle/dvf-explorer
  tag: v1.1.1

replicaCount: 1

dataset:
  url: s3://ddecrulle/DVF_Explorer/curated/current.json
  endpoint: https://minio.lab.sspcloud.fr
  anonymous: true

persistence:
  enabled: true
  size: 20Gi
  storageClass: null # Classe de stockage par défaut du cluster.

ingress:
  enabled: true
  className: "" # Classe Ingress par défaut du cluster.
  hosts:
    - host: dvf-explorer.lab.sspcloud.fr
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - dvf-explorer.lab.sspcloud.fr
      # Sans secretName : utilise le certificat par défaut du contrôleur Ingress.
      # Si nécessaire, ajouter ici secretName: <secret-tls-existant>.

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi

duckdb:
  memoryLimit: 2GB
  threads: 2
